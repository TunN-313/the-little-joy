            </button>

            {/* Header */}
            <div className="mb-8">
              <span className="text-xs font-bold uppercase tracking-[0.2em] text-[#BD6B4D]">
                STUDIO HÀ NỘI • TỰ PHỐI QUÀ TRỰC TUYẾN
              </span>
              <h3 className="font-serif text-2xl sm:text-3xl font-bold text-[#2C1E1A] mt-1">
                Tạo Tác Hộp Quà & Thiệp Theo Ý Bạn
              </h3>
              <p className="text-xs sm:text-sm text-[#2C1E1A]/70 mt-1">
                Tùy chỉnh phân loại theo ý bạn. Sau khi gửi cấu hình, shop sẽ gửi bản demo duyệt thiệp qua Zalo trước khi in ấn và đóng gói!
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
              
              {/* Form Controls (7 cols) */}
              <div className="md:col-span-7 space-y-6">
                
                {/* 1. Chọn Sản phẩm & Kích thước */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-[#2C1E1A] mb-2">
                    1. Chọn loại sản phẩm & kích thước
                  </label>
                  <div className="grid grid-cols-2 gap-2.5">
                    <button
                      type="button"
                      onClick={() => setProductType('large')}
                      className={`p-3 rounded-2xl border-2 text-left transition-all ${
                        productType === 'large'
                          ? 'border-[#BD6B4D] bg-[#BD6B4D]/10 ring-2 ring-[#BD6B4D]/30 font-bold'
                          : 'border-[#2C1E1A]/10 bg-white hover:border-[#BD6B4D]/40'
                      }`}
                    >
                      <div className="text-sm font-bold text-[#2C1E1A]">Box To (25x20cm)</div>
                      <div className="text-[11px] text-[#2C1E1A]/70">Heart Card, 8 ảnh, 2 mèo bông đôi, gương & lược.</div>
                    </button>

                    <button
                      type="button"
                      onClick={() => setProductType('small')}
                      className={`p-3 rounded-2xl border-2 text-left transition-all ${
                        productType === 'small'
                          ? 'border-[#BD6B4D] bg-[#BD6B4D]/10 ring-2 ring-[#BD6B4D]/30 font-bold'
                          : 'border-[#2C1E1A]/10 bg-white hover:border-[#BD6B4D]/40'
                      }`}
                    >
                      <div className="text-sm font-bold text-[#2C1E1A]">Box Bé (20x15cm)</div>
                      <div className="text-[11px] text-[#2C1E1A]/70">Bear Card, 3 ảnh, 1 mèo xù, lược pastel.</div>
                    </button>

                    <button
                      type="button"
                      onClick={() => setProductType('card-bear')}
                      className={`p-3 rounded-2xl border-2 text-left transition-all ${
                        productType === 'card-bear'
                          ? 'border-[#BD6B4D] bg-[#BD6B4D]/10 ring-2 ring-[#BD6B4D]/30 font-bold'
                          : 'border-[#2C1E1A]/10 bg-white hover:border-[#BD6B4D]/40'
                      }`}
                    >
                      <div className="text-sm font-bold text-[#2C1E1A]">Thiệp Gấu (11x14cm)</div>
                      <div className="text-[11px] text-[#2C1E1A]/70">Thiệp bán lẻ kèm ảnh Polaroid 5x7cm.</div>
                    </button>

                    <button
                      type="button"
                      onClick={() => setProductType('card-heart')}
                      className={`p-3 rounded-2xl border-2 text-left transition-all ${
                        productType === 'card-heart'
                          ? 'border-[#BD6B4D] bg-[#BD6B4D]/10 ring-2 ring-[#BD6B4D]/30 font-bold'
                          : 'border-[#2C1E1A]/10 bg-white hover:border-[#BD6B4D]/40'
                      }`}
                    >
                      <div className="text-sm font-bold text-[#2C1E1A]">Thiệp Trái Tim (11x14)</div>
                      <div className="text-[11px] text-[#2C1E1A]/70">Thiệp bán lẻ lồng ảnh kỷ niệm.</div>
                    </button>
                  </div>
                </div>

                {/* 2. Chọn Nền Thiệp */}
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-[#2C1E1A] mb-2">
                    2. Mẫu họa tiết nền thiệp (4 mẫu thực tế)
                  </label>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {styles.map(s => (
                      <button
                        key={s.id}
                        type="button"
                        onClick={() => setCardStyle(s.id)}
                        className={`p-2.5 rounded-xl border text-center text-xs font-semibold transition-all ${
                          cardStyle === s.id
                            ? 'bg-[#2C1E1A] text-white border-[#2C1E1A] font-bold shadow-xs'
                            : 'bg-white text-[#2C1E1A] border-[#2C1E1A]/10 hover:border-[#BD6B4D]'
                        }`}
                      >
                        {s.name}
                      </button>
                    ))}
                  </div>
                </div>

                {/* 3. Màu Phụ Kiện (nếu chọn box) */}
                {(productType === 'large' || productType === 'small') && (
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-[#2C1E1A] mb-2">
                      3. Tone màu lược chải tóc mini pastel
                    </label>
                    <div className="flex gap-3">
                      {[
                        { id: 'pink', name: 'Hồng Pastel', color: 'bg-pink-300' },
                        { id: 'yellow', name: 'Vàng Pastel', color: 'bg-amber-200' },
                        { id: 'purple', name: 'Tím Pastel', color: 'bg-purple-200' },
                      ].map(c => (
                        <button
                          key={c.id}
                          type="button"
                          onClick={() => setCombColor(c.id)}
                          className={`flex items-center gap-2 px-3.5 py-1.5 rounded-full border text-xs font-medium transition-all ${
                            combColor === c.id
                              ? 'border-[#BD6B4D] bg-white ring-2 ring-[#BD6B4D]/30 font-bold'
                              : 'border-[#2C1E1A]/10 bg-white/60 hover:bg-white'
                          }`}
                        >
                          <span className={`w-3.5 h-3.5 rounded-full ${c.color}`}></span>
                          <span>{c.name}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* 4. Tên Người Nhận & Lời Nhắn */}
                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-[#2C1E1A] mb-1">
                      {productType.startsWith('card') ? '3. Tên người nhận trên thiệp' : '4. Tên người nhận in trang trọng'}
                    </label>
                    <input
                      type="text"
                      value={recipientName}
                      onChange={(e) => setRecipientName(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-xl border border-[#2C1E1A]/20 bg-white text-[#2C1E1A] text-sm focus:outline-none focus:ring-2 focus:ring-[#BD6B4D]"
                      placeholder="VD: Em yêu, Lan Anh, Mẹ yêu..."
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-[#2C1E1A] mb-1">
                      {productType.startsWith('card') ? '4. Lời chúc riêng' : '5. Lời chúc riêng'}
                    </label>
                    <textarea
                      rows={3}
                      value={message}
                      onChange={(e) => setMessage(e.target.value)}
                      className="w-full px-4 py-2.5 rounded-xl border border-[#2C1E1A]/20 bg-white text-[#2C1E1A] text-sm focus:outline-none focus:ring-2 focus:ring-[#BD6B4D]"
                      placeholder="Nhập lời chúc đong đầy yêu thương của bạn..."
                    ></textarea>
                  </div>
                </div>

              </div>

              {/* Right Preview Card (5 cols) */}
              <div className="md:col-span-5 bg-white rounded-2xl p-5 border-2 border-[#2C1E1A]/10 shadow-lg sticky top-0">
                <div className="flex items-center justify-between pb-3 mb-3 border-b border-[#2C1E1A]/10">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span className="text-xs uppercase tracking-wider font-extrabold text-[#2C1E1A]">
                      Mô phỏng (Live Preview)
                    </span>
                  </div>
                  <span className="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full bg-[#F4DCD1] text-[#BD6B4D]">
                    {productType === 'large' ? 'BOX TO • 25x20' : productType === 'small' ? 'BOX BÉ • 20x15' : 'THIỆP 11x14'}
                  </span>
                </div>

                <div className="rounded-xl overflow-hidden aspect-[4/3] bg-[#FAF7F2] mb-3 border border-[#2C1E1A]/10">
                  <img
                    src={previewImg}
                    alt="Preview"
                    className="w-full h-full object-cover transition-all duration-300"
                  />
                </div>

                {/* Recipient preview */}
                <div className="p-3 rounded-xl bg-[#FAF7F2] border border-[#2C1E1A]/10 text-center mb-3">
                  <div className="text-[10px] uppercase font-bold text-[#2C1E1A]/60">Dành tặng:</div>
                  <div className="font-serif text-lg font-bold text-[#BD6B4D] mt-0.5">
                    "{recipientName || 'Người thương'}"
                  </div>
                  <div className="text-xs italic text-[#2C1E1A]/70 mt-1 line-clamp-2">
                    “{message || 'Made from little moments, made for someone special'}”
                  </div>
                </div>

                {/* Summary */}
                <div className="text-xs space-y-1.5 text-[#2C1E1A]/85 border-t border-[#2C1E1A]/10 pt-3">
                  <div className="flex justify-between">
                    <span className="text-[#2C1E1A]/60">Sản phẩm:</span>
                    <span className="font-bold">{getProductLabel()}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-[#2C1E1A]/60">Mẫu nền:</span>
                    <span className="font-bold">{activeStyleObj.name}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-[#2C1E1A]/60">Quyền lợi:</span>
                    <span className="font-bold text-emerald-700">Duyệt demo Zalo trước khi in</span>
                  </div>
                </div>

                {/* SUPER PROMINENT SUBMIT CTA */}
                <button
                  type="button"
                  onClick={handleSendZalo}
                  className="cta-shine mt-4 w-full py-4 px-5 rounded-full bg-[#BD6B4D] hover:bg-[#9e5033] text-white font-extrabold text-sm sm:text-base shadow-cta hover:shadow-cta-hover flex items-center justify-center gap-2 transition-all hover:scale-102 ring-2 ring-[#BD6B4D]/30"
                >
                  <MessageCircle className="w-5 h-5 text-white" />
                  <span>Gửi Cấu Hình Qua Zalo Lên Mẫu</span>
                </button>
                <div className="text-center text-[11px] text-[#2C1E1A]/60 mt-2">
                  ⚡ The Little Joy phản hồi và gửi bản demo duyệt trong 15 phút.
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    };

    // =========================================================================
    // 13. STICKY MOBILE CONVERSION BAR (Nút Chuyển Đổi Siêu Nổi Bật Trên Mobile)
    // =========================================================================
    const StickyMobileBar = ({ onOpenCustomizer }) => {
      return (
        <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#FAF7F2]/95 backdrop-blur-lg border-t border-[#2C1E1A]/15 p-3 flex items-center justify-between gap-2 shadow-2xl">
          <a
            href="https://www.tiktok.com/@the.little.joy.26?lang=vi-VN"
            target="_blank"
            rel="noopener noreferrer"
            className="flex-1 py-2.5 px-3 rounded-full bg-black text-white text-xs font-bold text-center flex items-center justify-center gap-1"
          >
            <span>TikTok Shop</span>
            <ExternalLink className="w-3 h-3 text-rose-400" />
          </a>

          <button
            type="button"
            onClick={onOpenCustomizer}
            className="cta-shine flex-[1.6] py-3 px-4 rounded-full bg-[#BD6B4D] text-white text-xs font-extrabold shadow-cta flex items-center justify-center gap-1.5 ring-2 ring-[#BD6B4D]/30"
          >
            <Sparkles className="w-3.5 h-3.5" />
            <span>Tự Phối Quà Ngay</span>
          </button>
        </div>
      );
    };

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    const App = () => {
      const [customizerOpen, setCustomizerOpen] = useState(false);
      const [selectedType, setSelectedType] = useState('large');
      const [preselectedModel, setPreselectedModel] = useState(null);

      const handleOpenCustomizer = () => {
        setPreselectedModel(null);
        setSelectedType('large');
        setCustomizerOpen(true);
      };

      const handleOpenCustomizerWithType = (type) => {
        setPreselectedModel(null);
        setSelectedType(type);
        setCustomizerOpen(true);
      };

      const handleSelectModel = (model) => {
        setPreselectedModel(model);
        setCustomizerOpen(true);
      };

      const handleCloseCustomizer = () => {
        setCustomizerOpen(false);
      };

      return (
        <div className="flex flex-col bg-[#FAF7F2] text-[#2C1E1A] min-h-screen">
          
          {/* Header & Navbar */}
          <Navbar onOpenCustomizer={handleOpenCustomizer} />

          {/* Hero Section */}
          <HeroSection 
            onOpenCustomizer={handleOpenCustomizer}
            onOpenSize={handleOpenCustomizerWithType}
          />

          {/* 1. Hộp Quà: Size To (25x20) & Size Bé (20x15) */}
          <BoxesSection 
            onSelectModel={handleSelectModel}
            onOpenCustomizerWithType={handleOpenCustomizerWithType}
          />

          {/* 2. Sản phẩm mới bán lẻ: Thiệp Cá Nhân Hóa (11x14 cm) */}
          <CardsSection 
            onOpenCustomizerWithType={handleOpenCustomizerWithType}
          />

          {/* 3. Mục đích, Ý nghĩa & Điểm Unique */}
          <UniqueSection />

          {/* 4. Quy trình 3 bước đặt hàng & Lưu ý gửi ảnh (chuẩn TikTok Shop) */}
          <HowToOrderSection onOpenCustomizer={handleOpenCustomizer} />

          {/* 5. Chính sách bán sỉ & bán lẻ */}
          <WholesaleRetailSection onOpenCustomizer={handleOpenCustomizer} />

          {/* 6. Vận chuyển, Giao hàng & Đổi trả 48H */}
          <ShippingAndReturnSection />

          {/* 7. Dây chuyền ảnh mẫu & Feedback */}
          <PhotoMarqueeSection onSelectImage={handleOpenCustomizer} />

          {/* 8. Đánh giá khách hàng */}
          <TestimonialsSection />

          {/* 9. Footer & Kênh Mua Sắm (TikTok, Instagram, Zalo) */}
          <Footer onOpenCustomizer={handleOpenCustomizer} />

          {/* Sticky Mobile Conversion Bar */}
          <StickyMobileBar onOpenCustomizer={handleOpenCustomizer} />

          {/* Customizer Modal */}
          <CustomizerModal
            isOpen={customizerOpen}
            onClose={handleCloseCustomizer}
            initialType={selectedType}
            preselectedModel={preselectedModel}
          />

        </div>
      );
    };

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
