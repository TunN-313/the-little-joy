<!DOCTYPE html>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            alabaster: '#FAF7F2',
            terracotta: {
              DEFAULT: '#BD6B4D',
              dark: '#a8593c',
              light: '#d68366',
            },
            blush: {

              soft: '#fdf6f2',
            },
            espresso: {
              DEFAULT: '#2C1E1A',
              card: '#221613',
              light: '#3f2c27',
            },
            gold: {

              wax: '#c79f2d',
              light: '#f5e8b5',

          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          animation: {
            'marquee-craft': 'marqueeCraft 25s linear infinite',
            'marquee-photos': 'marqueePhotos 38s linear infinite',
          },
          keyframes: {
            marqueeCraft: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-50%)' },
            },
            marqueePhotos: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-50%)' },

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX/TSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #FAF7F2;
      color: #2C1E1A;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;

    ::selection {
      background-color: #F4DCD1;
      color: #2C1E1A;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FAF7F2;
    }
    ::-webkit-scrollbar-thumb {
      background: #BD6B4D;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a8593c;
    }

    /* Pause marquee when hovering anywhere over the carousel container */
    .pause-on-hover:hover .marquee-track {
      animation-play-state: paused !important;
    }
  </style>
</head>

<body class="bg-[#FAF7F2] text-[#2C1E1A] antialiased selection:bg-[#F4DCD1] selection:text-[#2C1E1A]">

    // Ảnh 1 Fix: Thêm logo shop Images/LOGO.png cạnh tên shop, bỏ dòng Atelier...
    // thay bằng slogan chính thức: "Made from little moments, made for someone special"
    // =========================================================================

    const App = () => {
      const [customizerOpen, setCustomizerOpen] = useState(false);
      const [selectedBoxType, setSelectedBoxType] = useState('large');
      const [preselectedModel, setPreselectedModel] = useState(null);

      const handleOpenCustomizer = (type = 'large') => {
        setPreselectedModel(null);
        setSelectedBoxType(type);
        setCustomizerOpen(true);
      };

      const handleOpenCustomizerWithModel = (model) => {
        setPreselectedModel(model);
        setCustomizerOpen(true);
      };

      return (
        <div className="flex flex-col bg-[#FAF7F2] text-[#2C1E1A] min-h-screen">
          {/* Top Switcher Bar */}

            <span>✨ Bạn đang xem phiên bản Luxury Boutique của The Little Joy (Hà Nội).</span>
            <a href="index.html" className="text-[#D4AF37] hover:underline font-bold ml-1">
              Xem giao diện Classic tại đây →
            </a>
          </div>

          {/* 1. Hero & Navbar */}
          <HeroSection onOpenCustomizer={() => handleOpenCustomizer('large')} />

          {/* 2. InfoSection (Bento Grid tinh tế, ảnh sáng, thiệp trái tim, ảnh polaroid) */}
          <InfoSection onOpenCustomizer={() => handleOpenCustomizer('large')} />

          {/* 3. Photo Carousel Marquee (Ảnh chuyển động, hover dừng & phóng to) */}
          <PhotoMarqueeSection onSelectImage={() => handleOpenCustomizer('large')} />

          {/* 4. Bộ sưu tập 8 mẫu thực tế (4 Box To + 4 Box Bé, không che khuất) */}
          <ProductModelsSection onOpenCustomizerWithModel={handleOpenCustomizerWithModel} />

          {/* 5. Customer Testimonials */}
          <TestimonialsSection />

          {/* 6. Footer mộc mạc với lời tri ân Founder tại Hà Nội */}
          <Footer onOpenCustomizer={() => handleOpenCustomizer('large')} />

          {/* Customizer Modal */}
          <CustomizerModal
            isOpen={customizerOpen}
            onClose={() => setCustomizerOpen(false)}
            initialType={selectedBoxType}
            preselectedModel={preselectedModel}
          />
        </div>
      );
    };

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
